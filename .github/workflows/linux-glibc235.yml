name: Linux glibc 2.35 binary

# One-off: build linux-x86_64 against Ubuntu 22.04 (glibc 2.35) so the
# binary runs on Alibaba Cloud Linux 4 (glibc 2.38). ubuntu-latest is 2.39.

on:
  workflow_dispatch:
  push:
    branches: [build/linux-glibc235]

permissions:
  contents: read

concurrency:
  group: linux-glibc235-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  PROTOC_VERSION: "29.3"
  GROK_VERSION: "1.0.45+kazemae.16"

jobs:
  build:
    name: build (linux-x86_64-glibc235)
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: rustup show

      - name: Install protoc
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/protoc"
          curl -fsSL "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip" -o "$RUNNER_TEMP/protoc.zip"
          unzip -qo "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          chmod +x "$RUNNER_TEMP/protoc/bin/protoc"
          "$RUNNER_TEMP/protoc/bin/protoc" --version
          echo "PROTOC=$RUNNER_TEMP/protoc/bin/protoc" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-glibc235

      - name: Build release binary
        run: cargo build --release --locked -p xai-grok-pager-bin --target x86_64-unknown-linux-gnu

      - name: Smoke test (--version)
        run: |
          set -euo pipefail
          bin=target/x86_64-unknown-linux-gnu/release/xai-grok-pager
          "$bin" --version
          "$bin" --version | grep -qF "$GROK_VERSION"
          ldd "$bin" || true
          objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -u | tee glibc-syms.txt
          if grep -E 'GLIBC_2\.(39|4[0-9]|[5-9])' glibc-syms.txt; then
            echo "binary still requires glibc newer than 2.35"
            exit 1
          fi

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist/pkg
          cp target/x86_64-unknown-linux-gnu/release/xai-grok-pager dist/pkg/grok
          chmod +x dist/pkg/grok
          tar -czf dist/grok-1.0.45+kazemae.16-linux-x86_64-glibc235.tar.gz -C dist/pkg grok

      - uses: actions/upload-artifact@v5
        with:
          name: grok-linux-x86_64-glibc235
          path: dist/grok-1.0.45+kazemae.16-linux-x86_64-glibc235.tar.gz
          if-no-files-found: error
          retention-days: 7
